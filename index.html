<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYPC-程式競賽檔案繳交區</title>
    <style>
        /* 基本樣式重設與字型 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* 滿版區塊設定 */
        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* background */
        #login-section {
            background: linear-gradient(135deg, #667eea 0%, #55b9d2 100%);
        }

        /* label */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #4a4a4a;
            text-align: center;
        }

        /* frame */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #764ba2;
            outline: none;
        }

        /* login btn */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #5a3782;
        }
    </style>
</head>
<body>

    <div class="section" id="login-section">
        <div class="login-card">
            <h2>歡迎參加</h2>
            <h2><u>CYPC-程式設計競賽</u></h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">校園信箱</label>
                    <input type="email" id="email" placeholder="example@cyhs.tc.edu.tw (務必填寫正確)" required>
                </div>
                <div class="input-group">
                    <label for="student-class">班級</label>
                    <input type="text" id="student-class" placeholder="例如：401 (務必填寫正確)" required>
                </div>
                <div class="input-group">
                    <label for="student-name">姓名</label>
                    <input type="text" id="student-name" placeholder="例如：王大帥 (務必填寫正確)" required>
                </div>
                <button type="submit" class="btn-login">登入並前往上傳區</button>
                <p id="end-time" style="text-align: center;">結束時間：...</p>
            </form>
        </div>
    </div>

    <script>
        // 本網站由 吳禹叡 設計

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const studentClass = document.getElementById('student-class').value;
            const studentName = document.getElementById('student-name').value;

            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('email', email);
            sessionStorage.setItem('studentClass', studentClass);
            sessionStorage.setItem('studentName', studentName);

            window.location.href = '/upload';
        }

        window.onload = function() {
            fetch('/get-endtime')
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    let t = new Date(data.value * 1000).toLocaleTimeString();

                    document.getElementById("end-time").innerText = `結束時間：${t}`
                }
            })
            .catch(error => console.error('發生錯誤:', error));
        }
    </script>

</body>
</html>
